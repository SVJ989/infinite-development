<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Checkout | Infinite Development</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<!-- NAVBAR -->

<nav>

    <div class="logo">
        Infinite <span>Development</span>
    </div>

    <ul>
        <li>
            <a href="index.html">Home</a>
        </li>

        <li>
            <a href="shop.html">Shop</a>
        </li>

        <li>
            <a href="cart.html">Cart</a>
        </li>
    </ul>

    <a
        href="https://discord.gg/aWW6xKK9N"
        class="discordBtn"
        target="_blank"
        rel="noopener noreferrer">

        Join Discord

    </a>

</nav>


<!-- CHECKOUT -->

<section class="checkout-page">

    <h1>
        Complete Your <span>Order</span>
    </h1>


    <div class="checkout-box">

        <h2>Your Information</h2>


        <form id="checkout-form">

            <!-- NAME -->

            <label for="customer-name">
                Name
            </label>

            <input
                type="text"
                id="customer-name"
                placeholder="Your name"
                required
            >


            <!-- EMAIL -->

            <label for="customer-email">
                Email
            </label>

            <input
                type="email"
                id="customer-email"
                placeholder="you@example.com"
                required
            >


            <!-- DISCORD -->

            <label for="discord-name">
                Discord Username
            </label>

            <input
                type="text"
                id="discord-name"
                placeholder="username"
                required
            >


            <!-- ORDER -->

            <h2>
                Order
            </h2>

            <div id="checkout-items"></div>


            <!-- TOTAL -->

            <div class="checkout-total">

                <span>
                    Total:
                </span>

                <span>
                    €<span id="checkout-total">0.00</span>
                </span>

            </div>


            <!-- PAYMENT METHOD -->

            <div class="payment-section">

                <h2>
                    Payment Method
                </h2>


                <div class="payment-options">

                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                            value="tikkie"
                            checked
                        >

                        <div>

                            <strong>
                                💳 Tikkie
                            </strong>

                            <span>
                                Pay securely using Tikkie
                            </span>

                        </div>

                    </label>

                </div>


                <p class="manual-payment-info">

                    After placing your order, you will be
                    redirected to the Tikkie payment page.

                </p>

            </div>


            <!-- PLACE ORDER -->

            <button
                type="button"
                class="checkout-btn"
                onclick="placeOrder()">

                Place Order

            </button>

        </form>

    </div>

</section>


<!-- JAVASCRIPT -->

<script src="script.js"></script>
```

</body>

</html>
